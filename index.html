<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1512">
    <title>Sudha · Mayura</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header" id="app-header">
        <div class="page-header header-row">
          <label class="brand-switcher">
            <span class="sr-only">Publication</span>
            <select id="publication-select" class="brand-select" aria-label="Choose publication">
              <option value="SU">Sudha</option>
              <option value="MY">Mayura</option>
            </select>
          </label>
          <button class="edition-chip" id="edition-button" type="button" aria-label="Choose edition">
            <img id="edition-cover" alt="">
            <span id="edition-label">Edition</span>
            <span aria-hidden="true">▾</span>
          </button>
          <div class="header-actions">
            <button class="icon-button" id="search-button" type="button" aria-label="Search">⌕</button>
            <button class="icon-button" id="more-button" type="button" aria-label="More options">⋯</button>
          </div>
        </div>
        <div class="text-header" hidden>
          <div class="header-row">
            <button class="icon-button" id="back-button" type="button" aria-label="Back to page">←</button>
            <div class="article-header-title">
              <strong id="article-title">Article</strong>
              <span id="article-meta"></span>
            </div>
            <button class="icon-button" id="save-button" type="button" aria-label="Save article">☆</button>
            <button class="icon-button" id="text-more-button" type="button" aria-label="More options">⋯</button>
          </div>
          <div class="text-tools">
            <span id="text-page-meta"></span>
            <button class="text-size-button" id="text-smaller" type="button" aria-label="Decrease text size">A−</button>
            <button class="text-size-button" id="text-larger" type="button" aria-label="Increase text size">A+</button>
          </div>
          <div class="reading-progress" aria-hidden="true"><span id="progress-bar"></span></div>
        </div>
        <a class="mode-toggle" id="mode-toggle" href="?p=1" aria-label="Switch view">
          <span class="mode-page">Page</span><span class="mode-divider">↔</span><span class="mode-text">Text</span>
        </a>
      </header>

      <main>
        <section class="page-view" aria-label="Page reader">
          <div class="page-strip" id="page-strip" tabindex="0" aria-label="Magazine pages"></div>
          <div class="page-controls">
            <button class="round-button" id="previous-page" type="button" aria-label="Previous page">◀</button>
            <span id="page-indicator">Page 1 / 1</span>
            <button class="round-button" id="next-page" type="button" aria-label="Next page">▶</button>
          </div>
        </section>

        <article class="text-view" hidden>
          <div class="article-scroll" id="article-scroll" tabindex="0">
            <div class="article-content" id="article-content">
              <p class="loading">Loading article…</p>
            </div>
          </div>
        </article>
      </main>

      <section class="listen-player" id="listen-player" hidden aria-label="Listen controls">
        <button class="listen-play" id="listen-play" type="button" aria-label="Play article">▶</button>
        <span class="listen-status" id="listen-status">Listen</span>
        <label class="listen-control">Speed
          <select id="listen-rate" aria-label="Speech speed">
            <option value="0.8">0.8×</option>
            <option value="1" selected>1×</option>
            <option value="1.2">1.2×</option>
            <option value="1.5">1.5×</option>
          </select>
        </label>
        <label class="listen-control voice-control">Voice
          <select id="listen-voice" aria-label="Kannada voice"></select>
        </label>
      </section>

      <nav class="context-nav" id="context-nav" aria-label="Reader navigation"></nav>

      <section class="panel-host" id="panel-host" hidden>
        <div class="panel-backdrop" data-close-panel></div>
        <div class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">Reader</span>
              <h2 id="panel-title">Contents</h2>
            </div>
            <button class="icon-button" id="close-panel" type="button" aria-label="Close panel">×</button>
          </div>
          <div class="panel-body" id="panel-body"></div>
        </div>
      </section>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
