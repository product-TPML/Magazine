<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1512">
    <title>Sudha · Mayura</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header" id="app-header">
        <div class="page-header header-row">
          <a class="publication-home" id="publication-home" href="./"><img class="publication-logo" id="edition-logo" src="Assets/Sudha_Mast_GOLD-New Nandi.svg" alt="Sudha" width="96" height="32"></a>
          <div class="edition-summary">
            <button class="edition-control" id="edition-button" type="button" aria-label="Choose edition">
              <span id="edition-label">Edition</span>
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5" /></svg>
            </button>
          </div>
          <div class="view-mode-toggle" id="view-mode-toggle" role="group" aria-label="Page layout" hidden>
            <button class="view-mode-option" type="button" data-view-mode="single" aria-pressed="false" aria-label="Single page view" title="Single page"><svg class="layout-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 7h6M9 10h6"/></svg></button>
            <button class="view-mode-option" type="button" data-view-mode="double" aria-pressed="true" aria-label="Two-page spread view" title="Two-page spread"><svg class="layout-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="4" width="9" height="16" rx="1"/><rect x="12.5" y="4" width="9" height="16" rx="1"/><path d="M5 8h4M15 8h4"/></svg></button>
            <button class="view-mode-option" type="button" data-view-mode="scroll" aria-pressed="false" aria-label="Continuous scroll view" title="Continuous scroll"><svg class="layout-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="8" rx="1"/><rect x="5" y="13.5" width="14" height="8" rx="1"/><path d="M8 6h8M8 17h8"/></svg></button>
          </div>
          <button class="subscribe-button" id="subscribe-button" type="button"><span class="subscribe-badge"><span class="premium-icon" aria-hidden="true"></span><span class="subscribe-mobile-label">Subscribe</span><span class="subscribe-desktop-label" lang="kn">ಚಂದಾದಾರರಾಗಿ</span></span></button>
          <button class="icon-button account-button" id="account-button" type="button" aria-label="Sign in / My profile"><span class="account-icon" aria-hidden="true"></span></button>
          <button class="icon-button" id="menu-button" type="button" aria-label="Open menu"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16" /></svg></button>
        </div>

        <div class="text-header" hidden>
          <div class="header-row">
            <button class="icon-button" id="back-button" type="button" aria-label="Back to source page" title="Back to source page"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7M8 12h12" /></svg></button>
            <a class="publication-home text-publication-home" id="text-publication-home" href="./"><img class="text-publication-logo" id="text-edition-logo" src="Assets/Sudha_Mast_GOLD-New Nandi.svg" alt="Sudha magazine"></a>
            <div class="story-header-actions">
              <button class="icon-button" id="save-button" type="button" aria-label="Save article"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1Z" /></svg></button>
              <button class="subscribe-button" id="text-subscribe-button" type="button"><span class="subscribe-badge"><span class="premium-icon" aria-hidden="true"></span><span id="text-subscribe-label">Subscribe</span></span></button>
              <button class="icon-button account-button" id="text-account-button" type="button" aria-label="Sign in / My profile"><span class="account-icon" aria-hidden="true"></span></button>
              <button class="icon-button" id="text-menu-button" type="button" aria-label="Open menu"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16" /></svg></button>
            </div>
          </div>
        </div>
      </header>
      <div class="reading-progress" id="reading-progress" hidden aria-hidden="true"><span id="progress-bar"></span></div>

      <main>
        <section class="home-view" id="home-view" hidden aria-label="Home"></section>
        <section class="page-view" aria-label="Page reader">
          <div class="page-canvas" id="page-canvas" tabindex="0" aria-label="Magazine page">
            <div class="page-zoom-stage" id="page-zoom-stage">
              <div class="page-spread" id="page-spread"></div>
            </div>
            <button class="canvas-nav canvas-prev" id="previous-page" type="button" aria-label="Previous page"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg></button>
            <button class="canvas-nav canvas-next" id="next-page" type="button" aria-label="Next page"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg></button>
            <div class="zoom-controls" aria-label="Page zoom controls">
              <button class="zoom-button" id="zoom-out" type="button" aria-label="Zoom out"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
            <button class="zoom-button zoom-reset" id="zoom-reset" type="button" aria-label="Reset zoom" hidden><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 8a7 7 0 1 1 1.6 8.9M5 8V4m0 4h4" /></svg></button>
            <button class="zoom-button" id="zoom-in" type="button" aria-label="Zoom in"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
          </div>
          </div>
          <button class="swipe-hint" id="swipe-hint" type="button" hidden>Swipe horizontally to turn pages</button>
          <nav class="page-controls" id="page-controls" aria-label="Page actions">
            <button class="page-action" id="page-contents" type="button"><span class="control-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" /></svg></span><span>Contents</span></button>
            <button class="page-action page-number" id="page-number" type="button"><span class="control-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="7" rx="1.2" /><rect x="13.5" y="4" width="6.5" height="7" rx="1.2" /><rect x="4" y="13" width="6.5" height="7" rx="1.2" /><rect x="13.5" y="13" width="6.5" height="7" rx="1.2" /></svg></span><span>Page 1 / 1</span></button>
            <button class="page-action page-layout-toggle" id="page-layout-toggle" type="button" data-mode="swipe" aria-label="Page layout: Swipe. Switch to vertical"><span class="control-icon" aria-hidden="true"><svg class="icon layout-swipe" viewBox="0 0 24 24"><rect x="8" y="4.5" width="8" height="15" rx="1.5" /><path d="M4.5 9.5 2 12l2.5 2.5M19.5 9.5 22 12l-2.5 2.5" /></svg><svg class="icon layout-vertical" viewBox="0 0 24 24"><rect x="8" y="6.5" width="8" height="11" rx="1.5" /><path d="M9.5 4 12 1.8 14.5 4M9.5 20 12 22.2 14.5 20" /></svg></span><span id="page-layout-label">Swipe</span></button>
            <button class="page-action" id="page-article-action" type="button" hidden><span class="control-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M2.5 4.5h6a3.5 3.5 0 0 1 3.5 3.5v12a2.5 2.5 0 0 0-2.5-2.5h-7Z" /><path d="M21.5 4.5h-6A3.5 3.5 0 0 0 12 8v12a2.5 2.5 0 0 1 2.5-2.5h7Z" /></svg></span><span>Read article</span></button>
          </nav>
        </section>

        <article class="text-view" hidden>
          <button class="share-fab" id="share-fab" type="button" aria-label="Share"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="19" r="2.5" /><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5" /></svg></button>
          <div class="article-scroll" id="article-scroll" tabindex="0">
            <div class="article-content" id="article-content">
              <p class="loading">Loading article…</p>
            </div>
          </div>
        </article>
      </main>

      <section class="image-lightbox" id="image-lightbox" hidden aria-labelledby="lightbox-title">
        <div class="lightbox-backdrop" data-close-lightbox></div>
        <div class="lightbox-dialog" role="dialog" aria-modal="true">
          <div class="lightbox-toolbar">
            <h2 id="lightbox-title">Article image</h2>
            <span id="lightbox-counter" aria-live="polite">1 / 1</span>
            <button class="icon-button" id="lightbox-close" type="button" aria-label="Close image viewer"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
          </div>
          <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous image"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg></button>
          <figure class="lightbox-figure">
            <img id="lightbox-image" alt="">
            <figcaption id="lightbox-caption"></figcaption>
          </figure>
          <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next image"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg></button>
        </div>
      </section>

      <section class="listen-player" id="listen-player" hidden aria-label="Listen controls">
        <button class="listen-play" id="listen-play" type="button" aria-label="Play article"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z" /></svg></button>
        <span class="listen-status" id="listen-status">Listen</span>
        <progress id="listen-progress" value="0" max="1" aria-label="Speech progress"></progress>
        <label class="listen-control"><span id="listen-speed-label">Speed</span>
          <select id="listen-rate" aria-label="Speech speed">
            <option value="0.8">0.8×</option>
            <option value="1" selected>1×</option>
            <option value="1.2">1.2×</option>
            <option value="1.5">1.5×</option>
          </select>
        </label>
        <button class="listen-stop" id="listen-stop" type="button">Stop</button>
      </section>

      <nav class="article-controls" id="article-controls" aria-label="Article actions" hidden>
        <button class="article-action" id="article-font-smaller" type="button"><span class="control-icon" aria-hidden="true">ಅ−</span><span>Smaller</span></button>
        <button class="article-action" id="article-font-larger" type="button"><span class="control-icon" aria-hidden="true">ಅ+</span><span>Larger</span></button>
        <button class="article-action" id="article-listen" type="button"><span class="control-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M3.5 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-7a8.5 8.5 0 0 1 17 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" /></svg></span><span>Listen</span></button>
        <button class="article-action" id="article-share" type="button"><span class="control-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="19" r="2.5" /><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5" /></svg></span><span>Share</span></button>
      </nav>

      <section class="panel-host" id="panel-host" hidden>
        <div class="panel-backdrop" data-close-panel></div>
        <div class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <div class="panel-heading">
            <div>
              <h2 id="panel-title">Contents</h2>
            </div>
            <button class="icon-button" id="close-panel" type="button" aria-label="Close panel"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
          </div>
          <div class="panel-body" id="panel-body"></div>
        </div>
      </section>
    </div>
    <script type="module" src="app.js?v=modules"></script>
  </body>
</html>
